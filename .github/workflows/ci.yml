name: Python CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Step 4: Install project dependencies
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest ruff

      # Step 5: Run lint on Pull Request
      - name: Run lint
        run: |
          ruff check .

      # Step 6: Run tests on Pull Request
      - name: Run tests
        run: |
          pytest